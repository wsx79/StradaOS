name: Diagnóstico rumbo (emulador)
on:
  workflow_dispatch:
  push:
    branches: [ diag-rumbo ]
permissions:
  contents: write
jobs:
  rumbo:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        api: [30, 33]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew --no-daemon assembleDebug && cp app/build/outputs/apk/debug/*.apk prueba.apk
      - run: curl -fL --retry 5 -o malta.map https://download.mapsforge.org/maps/v5/europe/malta.map && ls -l malta.map
      - name: Activar KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          arch: x86_64
          target: default
          sdcard-path-or-size: 400M
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -skin 1280x720
          emulator-boot-timeout: 900
          script: bash .github/scripts/diag-rumbo.sh
      - name: Subir resultado
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p salida && cd salida
          git init -q -b diag-rumbo-out-${{ matrix.api }}
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -A
          git commit -q --allow-empty -m "diag rumbo API ${{ matrix.api }}"
          git push -f "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" diag-rumbo-out-${{ matrix.api }}
